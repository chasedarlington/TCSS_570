<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TUM-VIE Asynchronous Stream & Hardware Monitor</title>
  <style>
    body { margin: 0; background: #0f111a; color: #d0d7de; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #header { padding: 12px 24px; background: #161922; border-bottom: 1px solid #30363d; display: flex; gap: 30px; font-size: 14px; }
    .metric { display: flex; flex-direction: column; }
    .val { font-size: 18px; font-weight: bold; color: #58a6ff; }
    #viewport { display: flex; flex: 1; padding: 10px; gap: 10px; }
    .stream-box { flex: 1; display: flex; flex-direction: column; align-items: center; background: #000; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
    canvas { width: 100%; height: auto; image-rendering: pixelated; }
    #trajectory-view { flex: 1; background: #161922; border: 1px solid #30363d; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="header">
    <div class="metric"><span>CPU Power</span><span id="cpu-val" class="val">-- W</span></div>
    <div class="metric"><span>GPU Power</span><span id="gpu-val" class="val">-- W</span></div>
    <div class="metric"><span>GPU Utilization</span><span id="gpu-util" class="val">-- %</span></div>
    <div class="metric"><span>Neural Engine (ANE)</span><span id="ane-val" class="val">-- W</span></div>
  </div>

  <div id="viewport">
    <div class="stream-box">
      <span>Left Events</span>
      <canvas id="canvas-left" width="640" height="360"></canvas>
    </div>
    <div class="stream-box">
      <span>Right Events</span>
      <canvas id="canvas-right" width="640" height="360"></canvas>
    </div>
    <div id="trajectory-view"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const ws = new WebSocket(`ws://${location.host}/ws`);
    const ctxL = document.getElementById('canvas-left').getContext('2d');
    const ctxR = document.getElementById('canvas-right').getContext('2d');

    // Three.js 6-DoF Trajectory Scene
    const container = document.getElementById('trajectory-view');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const camFrustum = new THREE.CameraHelper(new THREE.PerspectiveCamera(50, 1.5, 0.2, 1));
    scene.add(camFrustum);
    const grid = new THREE.GridHelper(10, 20, 0x58a6ff, 0x30363d);
    scene.add(grid);
    camera.position.set(0, 3, 5);
    camera.lookAt(0, 0, 0);

    function paintCanvas(ctx, data, width, height) {
      const imgData = ctx.createImageData(width, height);
      let idx = 0;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const val = data[y][x];
          imgData.data[idx] = val === 255 ? 255 : 40;     // R
          imgData.data[idx + 1] = val === 128 ? 40 : 120; // G
          imgData.data[idx + 2] = val === 0 ? 255 : 40;   // B
          imgData.data[idx + 3] = 255;                    // Alpha
          idx += 4;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    ws.onmessage = (event) => {
      const packet = JSON.parse(event.data);

      // Hardware Stats
      document.getElementById('cpu-val').innerText = `${packet.metrics.cpu_w.toFixed(2)} W`;
      document.getElementById('gpu-val').innerText = `${packet.metrics.gpu_w.toFixed(2)} W`;
      document.getElementById('gpu-util').innerText = `${packet.metrics.gpu_util.toFixed(1)} %`;
      document.getElementById('ane-val').innerText = `${packet.metrics.ane_w.toFixed(2)} W`;

      // Event Slices
      paintCanvas(ctxL, packet.img_l, 640, 360);
      paintCanvas(ctxR, packet.img_r, 640, 360);

      // Pose Frustum Update
      const [px, py, pz] = packet.pose.pos;
      const [qw, qx, qy, qz] = packet.pose.quat;
      camFrustum.position.set(px, py, pz);
      camFrustum.quaternion.set(qx, qy, qz, qw);
      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
